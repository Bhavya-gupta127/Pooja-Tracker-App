plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.poojatracker'
    compileSdk 36

    defaultConfig {
        applicationId "com.bhavya.poojatracker"
        minSdk 23
        targetSdk 34
        versionCode 5
        versionName "1.4"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    def persistentKeystore = rootProject.file('../poojatracker-signing.jks')
    signingConfigs {
        persistent {
            if (persistentKeystore.exists()) {
                storeFile persistentKeystore
                storePassword "poojatracker2026"
                keyAlias "poojatracker"
                keyPassword "poojatracker2026"
            }
        }
    }

    buildTypes {
        debug {
            if (persistentKeystore.exists()) {
                signingConfig signingConfigs.persistent
            }
        }
        release {
            minifyEnabled false
            ndk {
                abiFilters "arm64-v8a", "armeabi-v7a"
            }
            if (persistentKeystore.exists()) {
                signingConfig signingConfigs.persistent
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    //exo player
    implementation "androidx.media3:media3-exoplayer:1.0.2"
    implementation "androidx.media3:media3-exoplayer-dash:1.0.2"
    implementation "androidx.media3:media3-ui:1.0.2"

    //youtube player gitrepo- PierfrancescoSoffritti android-youtube-player (13.1.0 fixes YouTube origin/referer embed blocks)
    implementation 'com.pierfrancescosoffritti.androidyoutubeplayer:core:13.1.0'

    //volley
    implementation 'com.android.volley:volley:1.2.1'

    //thumbnail
    implementation 'com.squareup.picasso:picasso:2.71828'

    //offline on-device OCR for zero-permission screen-recording / screenshot playlist import
    implementation 'com.google.mlkit:text-recognition-devanagari:16.0.1'
}
